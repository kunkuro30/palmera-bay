<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PALMERA BAY — Reborn</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e2a3f; font-family: "Trebuchet MS", Verdana, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .hud { position: fixed; z-index: 5; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.55); pointer-events: none; }
  #brand { top: 14px; left: 16px; }
  #brand .name { font-size: 30px; font-weight: 900; letter-spacing: 2px; color: #ffe9a8; -webkit-text-stroke: 1px rgba(90,50,0,.35); }
  #brand .sub { font-size: 12px; letter-spacing: 4px; color: #bfeaff; margin-top: -4px; }
  #stars { font-size: 24px; letter-spacing: 3px; color: #ffd23e; margin-top: 2px; min-height: 28px; }
  #stars .off { color: rgba(255,255,255,.28); }
  #wallet { top: 14px; right: 16px; text-align: right; }
  #cash { font-size: 26px; font-weight: 900; color: #8dff7a; }
  #healthWrap { width: 170px; height: 13px; background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.65); border-radius: 7px; margin-top: 6px; margin-left: auto; overflow: hidden; }
  #health { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5d5d, #ffb84d); }
  #minimap { left: 16px; bottom: 16px; border: 3px solid rgba(255,255,255,.7); border-radius: 10px; background: rgba(8,30,48,.85); }
  #objective { left: 50%; bottom: 18px; transform: translateX(-50%); max-width: 560px; text-align: center;
    background: rgba(6,24,40,.72); border: 2px solid rgba(255,210,62,.8); border-radius: 10px; padding: 7px 16px;
    font-size: 16px; font-weight: 700; color: #fff6d8; }
  #objective:empty { display: none; }
  #hint { right: 16px; bottom: 16px; font-size: 12px; line-height: 1.7; text-align: right; color: #dff3ff; background: rgba(6,24,40,.5); padding: 6px 10px; border-radius: 8px; }
  #toast { left: 50%; top: 84px; transform: translateX(-50%); font-size: 22px; font-weight: 900; color: #ffe9a8; text-align: center; opacity: 0; transition: opacity .25s; }
  #crosshair { left: 50%; top: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); opacity: 0; transition: opacity .12s; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: rgba(255,255,255,.92); box-shadow: 0 0 4px rgba(0,0,0,.7); }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  #crosshair .dot { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: #ff5964; transform: translate(-50%, -50%); box-shadow: 0 0 5px rgba(0,0,0,.8); }
  #startScreen { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    background: linear-gradient(180deg, rgba(10,30,50,0) 55%, rgba(6,20,36,.78)); color: #fff; cursor: pointer; }
  #startScreen .big { font-size: 64px; font-weight: 900; letter-spacing: 4px; color: #ffe9a8; text-shadow: 0 4px 0 #c46a12, 0 10px 26px rgba(0,0,0,.6); }
  #startScreen .tag { font-size: 17px; letter-spacing: 2px; color: #eaf7ff; margin-top: 2px; }
  #startScreen .play { margin: 20px 0 44px; font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #10344f; background: #ffd23e;
    padding: 12px 34px; border-radius: 999px; box-shadow: 0 6px 0 #b98a0e, 0 14px 30px rgba(0,0,0,.45); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="game" aria-label="Palmera Bay: a sunny open-world beach city. Walk, steal cars, run jobs, dodge the police."></canvas>
<p id="status" role="status" aria-live="polite"></p>

<div class="hud" id="brand">
  <div class="name">PALMERA BAY</div>
  <div class="sub">REBORN · SUNNY SIDE OF CRIME</div>
  <div id="stars"></div>
</div>
<div class="hud" id="wallet">
  <div id="cash">$0</div>
  <div id="healthWrap"><div id="health"></div></div>
</div>
<canvas class="hud" id="minimap" width="184" height="184"></canvas>
<div class="hud" id="objective"></div>
<div class="hud" id="hint">WASD move · SHIFT run<br>E enter / exit car · F punch<br>HOLD right mouse — aim · click — shoot<br>Mouse drag — look around</div>
<div class="hud" id="toast"></div>
<div class="hud" id="crosshair"><div class="dot"></div></div>

<div id="startScreen">
  <div class="big">PALMERA BAY</div>
  <div class="tag">A living beach city · jobs, wheels and wanted stars</div>
  <div class="play">CLICK TO PLAY</div>
</div>

<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
